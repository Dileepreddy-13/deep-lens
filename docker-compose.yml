version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: deeplens_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: deeplens
      POSTGRES_PASSWORD: deeplens_secure_password
      POSTGRES_DB: deeplens
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deeplens"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deeplens_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: deeplens_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - DATABASE_URL=postgresql://deeplens:deeplens_secure_password@db:5432/deeplens
      - REDIS_URL=redis://redis:6379/0
      - APP_ENV=production
      - DEMO_DATA_SEED_ON_STARTUP=true
    ports:
      - "8000:8000"

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: deeplens_web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "3000:80"

volumes:
  postgres_data:
